<nav
    class="fixed top-0 left-0 w-full h-16 flex items-center justify-between px-4 sm:px-6 bg-black border-b border-[var(--ale)]/50 z-50">

    <!-- Nombre -->
    <div>
        <span class="text-white text-sm sm:text-base font-semibold">
            @if (auth.userProfile()) {
            <span class="">
                Bienvenido {{ auth.userProfile()?.nombre }}
            </span>
            } @else {
            <span class=" text-[13px] sm:text-2xl">
                Games_Proyect
            </span>
            }
        </span>
    </div>

    
    <div class="flex gap-2 sm:gap-3 max-h-14" >
        <button class="px-2 py-1 sm:px-4 sm:py-2 text-xs sm:text-sm 
                       border border-gray-500 text-white rounded 
                       hover:bg-gray-800 transition">
            Quien Soy
        </button>
@if (!auth.currentUser()) {
        <!--Login -->
        <button class="h-10 min-w-[110px] flex items-center justify-center text-xs sm:text-sm
                       box-border border border-gray-500 rounded 
                       hover:bg-gray-800 transition" routerLink="/login">
            Iniciar
        </button>

        <!--Register -->
        <button class="h-10 min-w-[110px] flex items-center justify-center text-xs sm:text-sm
                       bg-blue-600 rounded 
                       hover:bg-blue-700 transition" routerLink="/register">
            Registro
        </button>}
        @if (auth.currentUser()) {
        <!--LogOut-->
        <button (click)="auth.logout()" 
        class="h-10 min-w-[110px] flex items-center justify-center text-xs sm:text-sm
         bg-[var(--azure-blue)] rounded 
         hover:bg-[var(--azure-blue-2)] transition">

            Cerrar sesión
        </button>}

    </div>

</nav>
